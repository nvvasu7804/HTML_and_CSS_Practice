<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Position Practice: Relative vs Absolute</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f9f9f9;
      }

      h1,
      h2 {
        color: #333;
      }

      .section {
        margin-bottom: 40px;
      }

      .code {
        background-color: #eee;
        padding: 10px;
        border-radius: 5px;
        font-family: monospace;
      }

      .relative-container {
        position: relative;
        background-color: #e0f7fa;
        padding: 20px;
        height: 300px;
        border: 2px dashed #0097a7;
        margin-top: 20px;
      }

      .box {
        width: 150px;
        height: 150px;
        background-color: lightblue;
        border: 2px solid #333;
        text-align: center;
        line-height: 150px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .absolute-box {
        position: absolute;
        top: 50px;
        left: 50px;
        background-color: coral;
        color: white;
      }

      .exercise-container {
        position: relative;
        background-color: #fff3e0;
        padding: 20px;
        height: 250px;
        border: 2px dashed #ff9800;
        margin-top: 20px;
      }

      .exercise-box {
        position: absolute;
        top: 30px;
        right: 30px;
        width: 120px;
        height: 120px;
        background-color: #8bc34a;
        color: white;
        text-align: center;
        line-height: 120px;
        font-weight: bold;
      }

      .nested-container {
        position: relative;
        background-color: #ede7f6;
        padding: 20px;
        height: 250px;
        border: 2px dashed #673ab7;
        margin-top: 20px;
      }

      .nested-box {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 100px;
        height: 100px;
        background-color: #3f51b5;
        color: white;
        text-align: center;
        line-height: 100px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>CSS Position Practice</h1>

    <div class="section">
      <h2>Example: Relative vs Absolute</h2>
      <div class="relative-container">
        <div class="box">Relative Box</div>
        <div class="box absolute-box">Absolute Box</div>
      </div>
    </div>

    <div class="section">
      <h2>Exercise 1: Move the Absolute Box</h2>
    </div>

    <div class="section">
      <h2>Exercise 2: Add Another Relative Container</h2>
      <div class="exercise-container">
        <div class="exercise-box">Exercise Box</div>
      </div>
    </div>

    <div class="section">
      <h2>Exercise 3: Nesting Absolute Inside Relative</h2>
      <div class="nested-container">
        <div class="nested-box">Nested Box</div>
      </div>
    </div>
  </body>
</html>
