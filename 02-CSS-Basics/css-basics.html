<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-Basics</title>
    <style>
      .subscribe-button {
        padding: 10px;
        border: none;
        border-radius: 2px;
        background-color: rgb(179, 9, 9);
        color: white;
        margin-right: 10px;
        cursor: pointer;
      }

      .join-button {
        background-color: white;
        border-width: 2px;
        color: rgb(0, 120, 224);
        border-color: rgb(21, 204, 255);
        height: 35px;
        width: 60px;
        border-radius: 2px;
        margin-right: 10px;
        font-weight: bold;
        cursor: pointer;
      }

      .tweet-button {
        color: white;
        font-weight: bold;
        background-color: rgb(19, 125, 196);
        border-radius: 20px;
        border: none;
        width: 70px;
        height: 35px;
      }

      .request-button {
        color: white;
        background-color: black;
        border: none;
        height: 40px;
        width: 120px;
        cursor: pointer;
      }

      .amazon-button {
        font-size: 16px;
        font-weight: 500;
        color: black;
        background-color: rgb(255, 216, 20);
        height: 40px;
        width: 200px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
      }

      .buyNow-button {
        font-size: 16px;
        font-weight: 500;
        color: black;
        background-color: rgb(255, 164, 28);
        height: 40px;
        width: 200px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        margin-left: 15px;
        font-weight: bold;
      }

      .signup-button {
        color: white;
        font-weight: bold;
        background-color: rgb(46, 164, 79);
        height: 40px;
        width: 110px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .getStarted-button {
        color: white;
        font-weight: bold;
        font-size: 13px;
        background-color: rgb(121, 82, 179);
        height: 40px;
        width: 125px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 10px;
      }

      .download-button {
        color: rgb(108, 117, 125);
        font-weight: bold;
        font-size: 13px;
        background-color: white;
        border-color: rgb(108, 117, 125);
        border-width: 1px;
        border-radius: 4px;
        height: 40px;
        width: 125px;
        cursor: pointer;
      }

      .linkedin-apply-button {
        color: white;
        background-color: rgb(10, 102, 194);
        height: 40px;
        width: 240px;
        border: none;
        border-radius: 20px;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
      }

      .save-button {
        color: rgb(10, 102, 194);
        background-color: white;
        border-color: rgb(10, 102, 194);
        border-width: 1px;
        border-radius: 20px;
        height: 40px;
        width: 90px;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
      }

      .amazon-link {
        color: rgb(0, 113, 133);
        font-size: 18px;
      }

      .price {
        font-weight: bold;
        color: rgb(0, 118, 0);
        font-size: 18px;
      }

      .delivery {
        font-size: 17px;
      }
    </style>
  </head>

  <body>
    <button class="subscribe-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>

    <h3>Practice Exercises</h3>

    <h4>1. Uber</h4>
    <button class="request-button">Request Now</button>

    <h4>2. Amazon</h4>
    <button class="amazon-button">Add to Cart</button>

    <h4>3. GitHub</h4>
    <button class="signup-button">Sign up</button>

    <h4>4. Bootstrap</h4>
    <button class="getStarted-button">Get Started</button>
    <button class="download-button">Download</button>

    <h4>5. LinkedIn</h4>
    <button class="linkedin-apply-button">Apply on Company Website</button>
    <button class="save-button">Save</button>

    <h4>5. Amazon Item</h4>

    <div>
      <a class="amazon-link" href="https://www.amazon.in/">Back to Amazon</a>

      <h1>Nike Black Running Shoes</h1>
      <p class="price">&#8377;1499 - in stock</p>
      <p class="delivery">Free Delivery Tomorrow</p>
    </div>

    <button class="amazon-button">Add to Cart</button>
    <button class="buyNow-button">Buy Now</button>
  </body>
</html>
